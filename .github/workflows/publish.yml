name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify release source and package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedTag = `v${pkg.version}`;
          if (pkg.name !== '@qacg/qk-test-analytics') {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match package version ${expectedTag}`);
          }
          NODE
          git fetch origin main:refs/remotes/origin/main --quiet
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Release tag must point to a commit contained in main.' >&2
            exit 1
          }

      - run: npm ci
      - run: npm run quality

      - name: Publish public package
        run: npm publish --access public --ignore-scripts
        env:
          # Bootstrap fallback for the first publish only. After npm Trusted
          # Publishing is configured, remove the NPM_TOKEN repository secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
